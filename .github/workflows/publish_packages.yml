name: Publish packages

on:
  push:
    tags:
      - 'lib-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 16.0.0-alpha31)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==
          cache-read-only: false

      - name: Resolve and prepare version
        id: version
        run: |
          RAW_INPUT="${{ inputs.version }}"
          if [ -n "$RAW_INPUT" ]; then
            # Strip leading 'lib-v' or 'v' if typed
            CLEAN_VERSION="${RAW_INPUT#lib-v}"
            CLEAN_VERSION="${CLEAN_VERSION#v}"
          elif [[ "${{ github.ref }}" == refs/tags/lib-v* ]]; then
            CLEAN_VERSION="${GITHUB_REF#refs/tags/lib-v}"
          else
            CLEAN_VERSION="16.0.0-dev.${{ github.run_number }}"
          fi

          TAG_NAME="lib-v$CLEAN_VERSION"
          echo "clean_version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          echo "Publishing version: $CLEAN_VERSION"
          echo "Target tag: $TAG_NAME"

          # If triggered via workflow_dispatch, create and push git tag if it doesn't already exist
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Checking if tag $TAG_NAME exists on remote..."
            if git ls-remote --tags origin "$TAG_NAME" | grep -q "$TAG_NAME"; then
              echo "Tag $TAG_NAME already exists on remote origin."
            else
              echo "Creating and pushing tag $TAG_NAME..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG_NAME" -m "Release $CLEAN_VERSION"
              git push origin "$TAG_NAME"
              echo "Tag $TAG_NAME created and pushed successfully."
            fi
          fi

      - name: Publish to GitHub Packages
        run: |
          ./gradlew publishAllPublicationsToGitHubPackagesRepository --parallel --build-cache --stacktrace || \
          (echo "First attempt failed, retrying in 10 seconds..." && sleep 10 && ./gradlew publishAllPublicationsToGitHubPackagesRepository --parallel --build-cache --stacktrace)
        env:
          PUBLISH_VERSION: ${{ steps.version.outputs.clean_version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### 🚀 Successfully published \`${{ steps.version.outputs.clean_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Git Tag**: \`${{ steps.version.outputs.tag_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package Registry**: https://github.com/${{ github.repository }}/packages" >> "$GITHUB_STEP_SUMMARY"
