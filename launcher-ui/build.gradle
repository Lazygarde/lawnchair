/*
 * The launcher UI, as a publishable library.
 *
 * Everything that used to be compiled straight into the root application module -- Launcher3
 * core, the Lawnchair layer on top of it, and quickstep -- lives here instead, so an app can
 * depend on the launcher instead of vendoring this repository. The root module keeps only what
 * genuinely belongs to an application: the applicationId, the flavors and the signing config.
 *
 * The source directories are the ones already in the repo; nothing was moved on disk.
 */
plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.google.ksp)
    alias(libs.plugins.google.protobuf)
    alias(libs.plugins.rikka.refine)
}

apply from: rootProject.file('gradle/launcher-version.gradle')

android {
    namespace "com.android.launcher3"

    defaultConfig {
        buildConfigField "int", "VERSION_CODE", "${launcher.versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${launcher.versionName}\""
        buildConfigField "String", "VERSION_DISPLAY_NAME", "\"${launcher.versionDisplayName}\""
        buildConfigField "String", "MAJOR_VERSION", "\"${launcher.majorVersion}\""
        buildConfigField "String", "COMMIT_HASH", "\"${launcher.commitHash}\""
        buildConfigField "boolean", "ENABLE_AUTO_INSTALLS_LAYOUT", "false"

        buildConfigField "int", "QUICKSTEP_MIN_SDK", launcher.quickstepMinSdk
        buildConfigField "int", "QUICKSTEP_MAX_SDK", launcher.quickstepMaxSdk
        manifestPlaceholders.quickstepMinSdk = launcher.quickstepMinSdk
        manifestPlaceholders.quickstepMaxSdk = launcher.quickstepMaxSdk

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            // Debug builds have always widened the quickstep SDK range so the recents
            // integration can be exercised outside the range shipped to users. AGP matches the
            // library's debug variant to the app's debug build type.
            manifestPlaceholders.quickstepMinSdk = "0"
            manifestPlaceholders.quickstepMaxSdk = "100000"
            buildConfigField "int", "QUICKSTEP_MIN_SDK", "0"
            buildConfigField "int", "QUICKSTEP_MAX_SDK", "100000"
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
        resValues true
        compose true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
    }

    // The resource overlays only work as overlays if they stay in separate source sets, the
    // way the app has always had them: lawnchair/res deliberately redefines strings and dimens
    // from res. Flattening them into one source set turns those into duplicate-resource errors,
    // so the app's flavor layout is mirrored here instead. There is only ever one combination.
    flavorDimensions += ["app", "recents"]

    productFlavors {
        lawn { dimension "app" }
        withQuickstep { dimension "recents" }
    }

    sourceSets {
        main {
            manifest.srcFile "$rootDir/AndroidManifest-common.xml"
            res.srcDirs = ["$rootDir/res", 'src/main/res']
            java.srcDirs = [
                "$rootDir/src",
                "$rootDir/src_plugins",
                "$rootDir/compose/facade/core",
                "$rootDir/compose/facade/enabled",
                "$rootDir/compose/features",
            ]
            kotlin.directories.addAll(java.srcDirs.collect { it.path })
            proto {
                srcDirs = ["$rootDir/protos/", "$rootDir/quickstep/protos_overrides/"]
            }
        }

        lawn {
            manifest.srcFile "$rootDir/lawnchair/AndroidManifest.xml"
            res.srcDirs = [
                "$rootDir/lawnchair/res",
                "$rootDir/platform_frameworks_libs_systemui/animationlib/res",
            ]
            java.srcDirs = [
                "$rootDir/src_flags",
                "$rootDir/src_shortcuts_overrides",
                "$rootDir/lawnchair/src",
                "$rootDir/tests/shared",
            ]
            kotlin.directories.addAll(java.srcDirs.collect { it.path })
            aidl.srcDirs = ["$rootDir/lawnchair/aidl"]
            assets.srcDirs = ["$rootDir/lawnchair/assets"]
            proto {
                srcDirs = ["$rootDir/lawnchair/protos/"]
            }
        }

        withQuickstep {
            manifest.srcFile "$rootDir/quickstep/AndroidManifest.xml"
            res.srcDirs = ["$rootDir/quickstep/res", "$rootDir/quickstep/recents_ui_overrides/res"]
            java.srcDirs = [
                "$rootDir/quickstep/src",
                "$rootDir/quickstep/dagger",
                "$rootDir/quickstep/recents_ui_overrides/src",
                "$rootDir/quickstep/src_protolog",
            ]
            kotlin.directories.addAll(java.srcDirs.collect { it.path })
        }

        // Declares app.lawnchair.LawnchairLauncher as the HOME activity, so a host that just
        // depends on this library gets a working launcher without copying manifest entries.
        lawnWithQuickstep {
            manifest.srcFile "$rootDir/quickstep/AndroidManifest-launcher.xml"
        }
    }
}

